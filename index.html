<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#14101f">
  <title>Arcana Trials</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #14101f;
      --panel: #201832;
      --card: #2a1f45;
      --gold: #e8c872;
      --text: #efe8ff;
      --muted: #c4b9d9;
      --border: #594879;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #2b1d4d, var(--bg) 65%);
      color: var(--text);
      font-family: Georgia, serif;
      padding: 32px 16px;
    }
    main { width: min(760px, 100%); margin: 0 auto; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { color: var(--gold); letter-spacing: 2px; margin: 0 0 8px; }
    .sub { color: var(--muted); margin: 0; line-height: 1.5; }
    .panel {
      margin: 0 auto;
      padding: clamp(20px, 5vw, 32px);
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgb(32 24 50 / 88%);
      box-shadow: 0 18px 55px rgb(0 0 0 / 25%);
    }
    .field { display: grid; gap: 8px; margin-bottom: 18px; text-align: left; }
    label { color: var(--gold); }
    select, input {
      width: 100%;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #1c1530;
      color: var(--text);
      font: inherit;
    }
    button {
      min-height: 44px;
      padding: 10px 20px;
      border: 1px solid var(--gold);
      border-radius: 8px;
      background: transparent;
      color: var(--gold);
      font: inherit;
      cursor: pointer;
      transition: background-color .15s ease, color .15s ease, transform .15s ease;
    }
    button:hover:not(:disabled), button:focus-visible {
      background: var(--gold);
      color: var(--bg);
    }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:disabled { opacity: .6; cursor: wait; }
    :focus-visible { outline: 2px solid #fff1bd; outline-offset: 3px; }
    .primary { width: 100%; margin-top: 4px; }
    .progress { color: var(--gold); letter-spacing: 1px; text-align: center; margin: 0 0 18px; }
    .trial-heading { text-align: center; margin: 0 0 8px; color: var(--gold); }
    .context, .prompt { line-height: 1.55; }
    .context { color: var(--muted); text-align: center; margin: 0 0 22px; }
    .prompt { font-size: 1.15rem; margin: 0 0 16px; }
    .scene-card {
      display: grid;
      gap: 12px;
      margin: 0 0 20px;
      padding: 16px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: linear-gradient(180deg, rgba(40, 28, 60, 0.95), rgba(20, 15, 31, 0.95));
    }
    .scene-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid var(--gold);
      border-radius: 12px;
      background: #120d21;
    }
    .scene-art {
      display: block;
      width: 100%;
      max-height: 260px;
      object-fit: cover;
      background: #120d21;
    }
    .dialogue-bubble {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 16px;
      padding: 12px 14px;
      border: 1px solid rgba(232, 200, 114, 0.8);
      border-radius: 14px;
      background: rgba(19, 14, 27, 0.84);
      color: var(--text);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      line-height: 1.45;
    }
    .npc-label {
      display: block;
      margin-bottom: 6px;
      color: var(--gold);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }
    .scene-caption {
      color: var(--muted);
      line-height: 1.5;
      margin: 0;
      text-align: center;
    }
    .choices { display: grid; gap: 12px; }
    .choice { text-align: left; color: var(--text); border-color: var(--border); }
    .status { min-height: 1.5em; margin: 14px 0 0; color: #ffd3ba; text-align: center; }
    .note { margin: 32px auto 0; max-width: 620px; color: var(--muted); font-size: .85rem; line-height: 1.5; text-align: center; }
    .journey { display: grid; gap: 14px; }
    .reading-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #1c1530;
    }
    .reading-card h3 { color: var(--gold); margin: 0 0 8px; }
    .reading-card p { line-height: 1.5; margin: 8px 0 0; }
    .reading-card .keywords { color: var(--muted); font-style: italic; }
    .summary-heading { text-align: center; color: var(--gold); }
    .summary-copy { line-height: 1.6; }
    .restart { display: block; margin: 20px auto 0; }
    dialog {
      width: min(440px, calc(100% - 28px));
      padding: 0;
      border: 1px solid var(--gold);
      border-radius: 16px;
      background: var(--panel);
      color: var(--text);
      box-shadow: 0 24px 90px rgb(0 0 0 / 65%);
    }
    dialog::backdrop { background: rgb(8 5 15 / 78%); backdrop-filter: blur(4px); }
    .popup { padding: 24px; text-align: center; animation: arrive .28s ease-out both; }
    .popup-position { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-size: .8rem; }
    .popup-art {
      display: block;
      width: min(190px, 70%);
      height: 210px;
      object-fit: cover;
      margin: 18px auto;
      border: 1px solid var(--gold);
      border-radius: 10px;
      background: #120d21;
    }
    .popup h2 { margin: 10px 0 6px; color: var(--gold); }
    .popup .keywords { color: var(--muted); font-style: italic; }
    .popup .meaning { line-height: 1.5; }
    .popup button { margin-top: 10px; }
    [hidden] { display: none !important; }
    @keyframes arrive {
      from { opacity: 0; transform: translateY(16px) scale(.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Arcana Trials</h1>
      <p class="sub">Choose a theme, meet three cards, and see where your choices lead.</p>
    </header>

    <section id="start-panel" class="panel" aria-labelledby="start-title">
      <h2 id="start-title">What would you like to explore?</h2>
      <form id="reading-form">
        <div class="field">
          <label for="topic">Choose a topic</label>
          <select id="topic" name="topic" required>
            <option value="career">What is my career like?</option>
            <option value="future">What is my future like?</option>
            <option value="love">What is my love life like?</option>
            <option value="growth">How can I grow?</option>
            <option value="change">What about a change I'm considering?</option>
          </select>
        </div>
        <div class="field">
          <label for="context">Add a little context <span>(optional)</span></label>
          <input id="context" name="context" maxlength="120" autocomplete="off" placeholder="A question or scenario on your mind">
        </div>
        <button class="primary" id="start-reading" type="submit">Begin your reading</button>
      </form>
    </section>

    <section id="reading-panel" class="panel" aria-live="polite" hidden>
      <p id="progress" class="progress"></p>
      <div id="trial"></div>
      <div id="summary" hidden></div>
    </section>

    <p id="status" class="status" role="alert"></p>
    <p class="note">For reflection and entertainment only. This reading is not a prediction or a substitute for professional medical, legal, or financial advice.</p>
  </main>

  <dialog id="card-modal" aria-labelledby="modal-card-name">
    <div class="popup">
      <p id="modal-position" class="popup-position"></p>
      <img id="modal-art" class="popup-art" alt="" hidden>
      <h2 id="modal-card-name"></h2>
      <p id="modal-keywords" class="keywords"></p>
      <p id="modal-meaning" class="meaning"></p>
      <button id="begin-trial" type="button">Begin this card's trial</button>
    </div>
  </dialog>

  <script type="module" src="src/main.js"></script>
</body>
</html>
